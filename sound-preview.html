<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonidos para resultados finales</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#0b1024;color:#f5f5ff}body{max-width:680px;margin:32px auto;padding:0 18px}h1{font-size:27px}p{color:#b0b8d2;line-height:1.5}.option{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 17px;margin:12px 0;border-radius:16px;background:#202945;border:1px solid #3a456a}.option strong{display:block}.option small{color:#aab4d1}.option button{border:0;border-radius:12px;background:#b4fa66;color:#12202c;padding:11px 17px;font-weight:900;min-width:92px}.option button:active{transform:scale(.96)}
</style>
</head>
<body>
<h1>Sonidos para el puntaje final</h1>
<p>Prueba las siete opciones y dime cuál quieres para cuando aparezcan los resultados finales.</p>
<div id="options"></div>
<script>
const seq=(frequencies,duration)=>frequencies.map(frequency=>[frequency,duration]);
const options=[
 {name:'1. Gran victoria',desc:'Fanfarria rápida con notas ágiles · 6,0 s.',wave:'sawtooth',notes:seq([392,523,659,784,659,784,988,784,659,523,659,784,988,1047,988,784,659,784,1047,1318,1047,988,784,659,784,988,1047,1318,1568,1318],.2)},
 {name:'2. Cascada de campanas',desc:'Campanas rápidas en una melodía ascendente · 5,8 s.',wave:'sine',notes:seq([784,988,1175,1568,1318,1047,1175,1568,1760,1568,1318,1175,988,1175,1568,2093,1760,1568,1318,1175,1568,1760,2093,1760,1568,1318,1568,2093,2349],.2)},
 {name:'3. Triunfo cinematográfico',desc:'Arpegios rápidos con final brillante · 5,9 s.',wave:'triangle',notes:seq([262,392,523,659,784,659,523,392,523,659,988,784,659,523,659,784,1175,988,784,659,784,988,1318,1175,988,784,988,1175,1568,1318,1568],.19)},
 {name:'4. Redoble de celebración',desc:'Redoble acelerado con remate corto · 5,8 s.',wave:'square',notes:seq([110,165,130,196,147,220,110,175,131,208,147,196,123,185,139,220,110,165,131,196,147,208,123,185,110,196,130,220,147,208,123,196,139,220,523,659,784,1047],.15)},
 {name:'5. Arcade triunfal',desc:'Chiptune rápido con remate brillante · 5,7 s.',wave:'square',notes:seq([659,784,988,784,1175,1047,784,659,523,659,784,988,1318,1175,988,784,988,1175,1318,1568,1318,1175,988,784,988,1318,1568,1318,1175,1568],.19)},
 {name:'6. Himno arcade original',desc:'Fanfarria retro rápida de estadio · 5,8 s.',wave:'square',notes:seq([294,440,587,392,523,698,587,466,622,784,659,523,698,880,740,988,784,587,698,523,659,880,784,622,740,988,880,698,988],.2)},
 {name:'7. Ringtone arcade de victoria',desc:'Chiptune monofónico rápido y pegadizo · 5,8 s.',wave:'square',notes:seq([392,587,494,659,440,587,784,698,523,659,880,784,587,440,523,698,784,988,880,659,784,1047,988,784,659,880,1175,988,784,1047,1318,1175],.18)}
];
const root=document.querySelector('#options');
for(const [i,o] of options.entries()){const row=document.createElement('div');row.className='option';row.innerHTML=`<div><strong>${o.name}</strong><small>${o.desc}</small></div><button type="button">▶ Play</button>`;row.querySelector('button').addEventListener('click',()=>play(o));root.append(row)}
let ctx;
function tone(freq,start,duration,volume=.18,type='sine'){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(gain).connect(ctx.destination);osc.start(start);osc.stop(start+duration+.02)}
function play(o){ctx??=new AudioContext();ctx.resume();let t=ctx.currentTime+.03;for(const [f,d] of o.notes){tone(f,t,d,.16,o.wave);if(o.wave!=='square')tone(f/2,t,d,.045,'triangle');t+=d}}
</script>
</body>
</html>
